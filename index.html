<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14122b">
<title>SUM-AI</title>
<style>
  :root {
    --bg: #14122b;
    --panel: #1e1b3d;
    --line: #34305f;
    --ink: #f3f1ff;
    --mute: #a9a5d1;
    --accent: #8f7cff;
    --accent-ink: #14122b;
    --err: #ff8a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Noto Sans Myanmar", "Myanmar Text", sans-serif;
    line-height: 1.7; min-height: 100vh;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { color: var(--mute); margin: 0 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  label { display: block; color: var(--mute); font-size: .9rem; margin: 10px 0 4px; }
  input, textarea, select {
    width: 100%; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 16px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; width: 100%; margin-top: 12px;
  }
  button.ghost { background: transparent; color: var(--mute); border: 1px solid var(--line); }
  button:disabled { opacity: .55; cursor: default; }
  .row { display: flex; gap: 10px; }
  .row button { margin-top: 12px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .credits { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .email { color: var(--mute); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; }
  #msg { min-height: 1.4em; margin: 8px 0 0; font-size: .9rem; color: var(--err); }
  #out { white-space: pre-wrap; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>SUM-AI</h1>
  <p class="sub">ဇာတ်လမ်းရေးစက်</p>

  <section id="authView" class="panel">
    <label for="email">အီးမေးလ်</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">
    <label for="pass">စကားဝှက် (အနည်းဆုံး ၆ လုံး)</label>
    <input id="pass" type="password" autocomplete="current-password">
    <div class="row">
      <button id="loginBtn">ဝင်မည်</button>
      <button id="regBtn" class="ghost">အကောင့်ဖွင့်မည်</button>
    </div>
    <p id="msg" role="alert"></p>
  </section>

  <section id="appView" class="hidden">
    <div class="panel bar">
      <span class="email" id="who"></span>
      <span class="credits" id="credits">0 ခရက်ဒစ်</span>
      <button id="outBtn" class="ghost" style="width:auto;margin:0;padding:8px 12px">ထွက်မည်</button>
    </div>
    <div class="panel">
      <label for="tool">ကိရိယာ ရွေးပါ</label>
      <select id="tool"></select>
      <label for="idea" id="ideaLabel"></label>
      <textarea id="idea"></textarea>
      <div id="langBox" class="hidden">
        <label for="lang">ပြန်မည့် ဘာသာစကား</label>
        <select id="lang">
          <option>မြန်မာ</option>
          <option>English</option>
          <option>ไทย</option>
          <option>中文</option>
        </select>
      </div>
      <button id="genBtn">စတင်မည် (၁ ခရက်ဒစ်)</button>
      <p id="msg2" role="alert" style="color:var(--err);font-size:.9rem;min-height:1.4em;margin:8px 0 0"></p>
    </div>
    <div class="panel hidden" id="outPanel"><div id="out"></div></div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { initializeAppCheck, ReCaptchaEnterpriseProvider }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app-check.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, increment }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import { getAI, getGenerativeModel, GoogleAIBackend }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-ai.js";

const firebaseConfig = {
  apiKey: "AIzaSyCRzCPLQ-ObY6EXoKxgyKucBKmzqx1LzVg",
  authDomain: "sum-ai-17ff2.firebaseapp.com",
  projectId: "sum-ai-17ff2",
  storageBucket: "sum-ai-17ff2.firebasestorage.app",
  messagingSenderId: "134994518975",
  appId: "1:134994518975:web:552f16c5c31b4032f4f70a"
};

const app = initializeApp(firebaseConfig);
initializeAppCheck(app, {
  provider: new ReCaptchaEnterpriseProvider("6LfefPMtAAAAAFe_w9zliIeEaQhyLaLfwQr50DKA"),
  isTokenAutoRefreshEnabled: true
});
const auth = getAuth(app);
const db = getFirestore(app);
const model = getGenerativeModel(getAI(app, { backend: new GoogleAIBackend() }), { model: "gemini-3.8-flash" });

const $ = (id) => document.getElementById(id);
const START_CREDITS = 10;
let credits = 0;

function errText(e) {
  const c = e && e.code || "";
  if (c.includes("invalid-email")) return "အီးမေးလ် ပုံစံ မှားနေသည်။";
  if (c.includes("weak-password")) return "စကားဝှက် အနည်းဆုံး ၆ လုံး လိုသည်။";
  if (c.includes("email-already-in-use")) return "ဤအီးမေးလ်ဖြင့် အကောင့်ရှိပြီးသား၊ ဝင်မည်ကို နှိပ်ပါ။";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found"))
    return "အီးမေးလ် သို့မဟုတ် စကားဝှက် မှားနေသည်။";
  if (c.includes("network")) return "အင်တာနက် ချိတ်ဆက်မှု စစ်ပါ။";
  return "အမှား: " + (e && e.message ? e.message : e);
}

$("loginBtn").onclick = async () => {
  $("msg").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch (e) { $("msg").textContent = errText(e); }
};
$("regBtn").onclick = async () => {
  $("msg").textContent = "";
  try { await createUserWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch (e) { $("msg").textContent = errText(e); }
};
$("outBtn").onclick = () => signOut(auth);

function showCredits() { $("credits").textContent = credits + " ခရက်ဒစ်"; }

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    $("authView").classList.remove("hidden");
    $("appView").classList.add("hidden");
    return;
  }
  $("authView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  $("who").textContent = user.email;
  try {
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, { email: user.email, credits: START_CREDITS });
      credits = START_CREDITS;
    } else {
      credits = snap.data().credits ?? 0;
    }
    showCredits();
  } catch (e) {
    $("msg2").textContent = "ခရက်ဒစ် ဖတ်မရပါ: " + e.message;
  }
});

const TOOLS = {
  story: {
    name: "ဇာတ်လမ်းရေးစက်",
    label: "ဇာတ်လမ်း ခေါင်းစဉ် သို့မဟုတ် အကြံ",
    hint: "ဥပမာ - တောထဲမှာ ပျောက်သွားတဲ့ ကလေးတစ်ယောက်",
    prompt: (t) => "မြန်မာဘာသာဖြင့် ဇာတ်လမ်းတိုတစ်ပုဒ် ရေးပေးပါ။ အစ၊ အလယ်၊ အဆုံး ပါရမည်။ စာသားသက်သက်သာ ရေးပါ။ Markdown သင်္ကေတ (**, ##, ---, *) မသုံးပါနှင့်။ ခေါင်းစဉ်/အကြံ: " + t
  },
  translate: {
    name: "ဘာသာပြန်",
    label: "ပြန်ချင်သော စာသား",
    hint: "စာသား ထည့်ပါ",
    lang: true,
    prompt: (t, l) => "အောက်ပါစာသားကို " + l + " ဘာသာသို့ သဘာဝကျကျ ပြန်ပေးပါ။ ပြန်ထားသော စာသားသာ ပေးပါ၊ ရှင်းလင်းချက် မထည့်ပါနှင့်။ Markdown သင်္ကေတ မသုံးပါနှင့်။\n\n" + t
  },
  srt: {
    name: "SRT ဘာသာပြန်",
    label: "SRT ဖိုင်ထဲက စာသား (paste လုပ်ပါ)",
    hint: "1\n00:00:01,000 --> 00:00:03,000\nHello",
    lang: true,
    prompt: (t, l) => "အောက်ပါ SRT subtitle ကို " + l + " ဘာသာသို့ ပြန်ပါ။ အချိန်ကုဒ်နှင့် အလိုက်နံပါတ်များကို မပြောင်းဘဲ မူရင်းအတိုင်း ထားပါ။ စာသားကိုသာ ပြန်ပါ။ SRT ပုံစံအတိုင်းသာ ပေးပါ၊ ရှင်းလင်းချက်နှင့် code block မထည့်ပါနှင့်။\n\n" + t
  },
  recap: {
    name: "Recap စာသားရေး",
    label: "ရုပ်ရှင်/ဗီဒီယို အကျဉ်း သို့မဟုတ် အကြောင်းအရာ",
    hint: "ဇာတ်လမ်းအကျဉ်းကို ရေးထည့်ပါ",
    prompt: (t) => "အောက်ပါ အကြောင်းအရာကို အခြေခံပြီး မြန်မာဘာသာဖြင့် Recap ဗီဒီယိုအတွက် အသံဖတ်စာ (narration script) ရေးပေးပါ။ စိတ်ဝင်စားဖွယ်ဖြစ်အောင် စတင်ပြီး ပိုဒ်တိုများဖြင့် ရေးပါ။ စာသားသက်သက်သာ ရေးပါ၊ Markdown သင်္ကေတ မသုံးပါနှင့်။\n\n" + t
  }
};

const toolSel = $("tool");
for (const k in TOOLS) {
  const o = document.createElement("option");
  o.value = k; o.textContent = TOOLS[k].name;
  toolSel.appendChild(o);
}
function applyTool() {
  const t = TOOLS[toolSel.value];
  $("ideaLabel").textContent = t.label;
  $("idea").placeholder = t.hint;
  $("langBox").classList.toggle("hidden", !t.lang);
  $("genBtn").textContent = t.name + " (၁ ခရက်ဒစ်)";
  $("outPanel").classList.add("hidden");
  $("msg2").textContent = "";
}
toolSel.onchange = applyTool;
applyTool();

$("genBtn").onclick = async () => {
  const t = TOOLS[toolSel.value];
  const text = $("idea").value.trim();
  $("msg2").textContent = "";
  if (!text) { $("msg2").textContent = "စာသား အရင်ထည့်ပါ။"; return; }
  if (credits < 1) { $("msg2").textContent = "ခရက်ဒစ် မလောက်တော့ပါ။"; return; }
  const btn = $("genBtn");
  btn.disabled = true; btn.textContent = "လုပ်ဆောင်နေသည်...";
  try {
    const res = await model.generateContent(t.prompt(text, $("lang").value));
    $("out").textContent = res.response.text()
      .replace(/```[a-z]*\n?/g, "")
      .replace(/\*\*/g, "")
      .replace(/^#{1,6}\s*/gm, "")
      .replace(/^\s*-{3,}\s*$/gm, "")
      .replace(/^\s*\*\s+/gm, "");
    $("outPanel").classList.remove("hidden");
    await updateDoc(doc(db, "users", auth.currentUser.uid), { credits: increment(-1) });
    credits -= 1; showCredits();
  } catch (e) {
    $("msg2").textContent = "မအောင်မြင်ပါ: " + (e.message || e);
  }
  btn.disabled = false;
  btn.textContent = t.name + " (၁ ခရက်ဒစ်)";
};
</script>
</body>
</html>
