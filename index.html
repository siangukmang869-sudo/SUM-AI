<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14122b">
<title>SUM-AI</title>
<style>
  :root { --bg:#14122b; --panel:#1e1b3d; --line:#34305f; --ink:#f3f1ff; --mute:#a9a5d1; --accent:#8f7cff; --accent-ink:#14122b; --err:#ff8a8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh; line-height:1.7;
    font-family:system-ui,-apple-system,"Noto Sans Myanmar","Myanmar Text",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:1.5rem; margin:0; }
  h2 { font-size:1rem; margin:22px 0 10px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  label { display:block; color:var(--mute); font-size:.9rem; margin:10px 0 4px; }
  input, textarea, select { width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:12px; font:inherit; }
  textarea { min-height:110px; resize:vertical; }
  input:focus, textarea:focus, select:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 16px; background:var(--accent); color:var(--accent-ink); cursor:pointer; width:100%; margin-top:12px; }
  button.ghost { background:transparent; color:var(--mute); border:1px solid var(--line); }
  button.small { width:auto; margin:0; padding:8px 12px; }
  button:disabled { opacity:.55; cursor:default; }
  .row { display:flex; gap:10px; }
  .credits { font-weight:700; color:var(--accent); white-space:nowrap; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px 6px; }
  .tool { background:none; color:var(--ink); padding:0; margin:0; font-weight:500; font-size:.74rem; line-height:1.35; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .dot { width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.6rem; background:color-mix(in srgb, var(--c) 28%, var(--panel)); border:1px solid color-mix(in srgb, var(--c) 55%, transparent); }
  .tool:active .dot { transform:scale(.94); }
  #msg, #msg2 { color:var(--err); font-size:.9rem; min-height:1.4em; margin:8px 0 0; }
  #out { white-space:pre-wrap; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>SUM-AI</h1>
    <div id="bar" class="row hidden" style="align-items:center">
      <span class="credits" id="credits">0 ခရက်ဒစ်</span>
      <button id="outBtn" class="ghost small">ထွက်မည်</button>
    </div>
  </div>

  <p id="boot" style="display:none;color:#ff8a8a;font-size:.85rem;word-break:break-all"></p>

  <section id="authView" class="panel">
    <label for="email">အီးမေးလ်</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">
    <label for="pass">စကားဝှက် (အနည်းဆုံး ၆ လုံး)</label>
    <input id="pass" type="password" autocomplete="current-password">
    <label style="display:flex;gap:8px;align-items:center;margin:10px 0 0"><input type="checkbox" id="showPass" style="width:auto"> စကားဝှက် ပြမည်</label>
    <div class="row">
      <button id="loginBtn">ဝင်မည်</button>
      <button id="regBtn" class="ghost">အကောင့်ဖွင့်မည်</button>
    </div>
    <button id="forgotBtn" class="ghost" style="margin-top:8px">စကားဝှက်မေ့သွားလား</button>
    <p id="msg" role="alert"></p>
  </section>

  <section id="homeView" class="hidden"></section>

  <section id="toolView" class="hidden">
    <button id="backBtn" class="ghost small" style="margin-bottom:12px">‹ နောက်သို့</button>
    <div class="panel">
      <h2 id="toolTitle" style="margin-top:0"></h2>
      <label for="idea" id="ideaLabel"></label>
      <textarea id="idea" placeholder="ဒီမှာ ရေးထည့်ပါ"></textarea>
      <div id="langBox" class="hidden">
        <label for="lang">ပြန်မည့် ဘာသာစကား</label>
        <select id="lang"><option value="Burmese">Burmese (မြန်မာ)</option><option value="English">English</option><option value="Thai">Thai</option><option value="Chinese">Chinese</option></select>
      </div>
      <div id="imgBox" class="hidden">
        <label for="imgFile">ဓာတ်ပုံ (မထည့်လည်းရ၊ ထည့်ရင် ပုံကနေ ဗီဒီယို လုပ်မည်)</label>
        <input id="imgFile" type="file" accept="image/*">
      </div>
      <div id="durBox" class="hidden">
        <label for="dur">ဗီဒီယို ကြာချိန်</label>
        <select id="dur"><option value="2">၂ စက္ကန့်</option><option value="3" selected>၃ စက္ကန့်</option><option value="5">၅ စက္ကန့်</option></select>
      </div>
      <button id="genBtn">စတင်မည် (၁ ခရက်ဒစ်)</button>
      <p id="msg2" role="alert"></p>
    </div>
    <div class="panel hidden" id="outPanel">
      <div id="out"></div>
      <button id="copyBtn" class="ghost">ကူးယူမည်</button>
    </div>
  </section>
</main>

(function () {
  var box = document.createElement("div");
  box.style.cssText = "position:fixed;left:0;right:0;bottom:0;background:#7a1f1f;color:#fff;padding:10px 14px;font:13px system-ui;z-index:99;display:none;white-space:pre-wrap;word-break:break-all";
  document.addEventListener("DOMContentLoaded", function () { document.body.appendChild(box); });
  function show(m) { box.style.display = "block"; box.textContent = "Error: " + m; }
  window.addEventListener("error", function (e) {
    var t = e.target;
    if (t && t.tagName === "SCRIPT") show("script failed to load: " + (t.src || "inline module"));
    else if (!t || t === window) show((e.message || "script error") + (e.filename ? " @" + e.filename.split("/").pop() + ":" + e.lineno : ""));
  }, true);
  window.addEventListener("unhandledrejection", function (e) { show("promise: " + ((e.reason && e.reason.message) || e.reason)); });
})();
</script>
<script>
  window.__boot = false;
  function showBoot(m) { var b = document.getElementById("boot"); if (b) { b.textContent = m; b.style.display = "block"; } }
  window.addEventListener("error", function (e) {
    if (e.target && e.target !== window && e.target.tagName !== "SCRIPT") return;
    showBoot("Script အမှား: " + (e.message || (e.target && e.target.src) || "unknown"));
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    showBoot("Script အမှား: " + ((e.reason && e.reason.message) || e.reason));
  });
  setTimeout(function () {
    if (!window.__boot) showBoot("Script မစတင်ပါ။ အင်တာနက် စစ်ပြီး စာမျက်နှာကို ပြန်ဖွင့်ပါ။");
  }, 8000);
</script>

function errText(e) {
  const c = (e && e.code) || "";
  if (c.includes("invalid-email")) return "အီးမေးလ် ပုံစံ မှားနေသည်။";
  if (c.includes("weak-password")) return "စကားဝှက် အနည်းဆုံး ၆ လုံး လိုသည်။";
  if (c.includes("email-already-in-use")) return "ဤအီးမေးလ်ဖြင့် အကောင့်ရှိပြီးသား၊ ဝင်မည်ကို နှိပ်ပါ။";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "အီးမေးလ် သို့မဟုတ် စကားဝှက် မှားနေသည်။";
  if (c.includes("too-many-requests")) return "အကြိမ်များလွန်းသည်၊ ခဏစောင့်ပြီး ထပ်ကြိုးစားပါ။";
  if (c.includes("network")) return "အင်တာနက် ချိတ်ဆက်မှု စစ်ပါ။";
  return "အမှား: " + (e && e.message ? e.message : e);
}

$("forgotBtn").onclick = async () => {
  const email = $("email").value.trim();
  $("msg").style.color = "var(--err)";
  if (!email) { $("msg").textContent = "အီးမေးလ် အရင်ထည့်ပါ။"; return; }
  try {
    await sendPasswordResetEmail(auth, email);
    $("msg").style.color = "var(--mute)";
    $("msg").textContent = "စကားဝှက်ပြန်သတ်မှတ်ရန် အီးမေးလ် ပို့ပြီးပါပြီ။ Inbox နှင့် Spam ကို စစ်ပါ။";
  } catch (e) { $("msg").textContent = errText(e); }
};

function showCredits() { $("credits").textContent = credits + " ခရက်ဒစ်"; }

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    $("authView").classList.remove("hidden");
    $("bar").classList.add("hidden");
    $("homeView").classList.add("hidden");
    $("toolView").classList.add("hidden");
    return;
  }
  $("authView").classList.add("hidden");
  $("bar").classList.remove("hidden");
  $("homeView").classList.remove("hidden");
  try {
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, { email: user.email, credits: START_CREDITS });
      credits = START_CREDITS;
    } else {
      credits = snap.data().credits ?? 0;
    }
    showCredits();
  } catch (e) {
    $("credits").textContent = "ခရက်ဒစ် ဖတ်မရပါ";
  }
});

      img.crossOrigin = "anonymous";
      let timer;
      const fail = () => { clearTimeout(timer); n > 1 ? attempt(n - 1) : bad(new Error("ပုံဆာဗာ ချိတ်မရပါ (အင်တာနက်၊ ဆာဗာ ရပ်နေခြင်း၊ သို့မဟုတ် ဗီဒီယိုပေါင်းခွင့် မပေးခြင်း ဖြစ်နိုင်သည်)။")); };
      timer = setTimeout(fail, 60000);
      img.onload = () => { clearTimeout(timer); ok(img); };
      img.onerror = fail;
      img.src = "https://image.pollinations.ai/prompt/" + encodeURIComponent(String(prompt).slice(0, 400) + ", vertical composition, no text") +
        "?width=576&height=1024&nologo=true&seed=" + Math.floor(Math.random() * 1e6);
    };
    attempt(2);
  });
}

function wrapText(ctx, text, max) {
  let parts;
  try {
    const seg = (g, t) => [...new Intl.Segmenter(undefined, { granularity: g }).segment(t)].map((x) => x.segment);
    parts = seg("word", text).flatMap((w) => (ctx.measureText(w).width > max ? seg("grapheme", w) : [w]));
  } catch { parts = Array.from(text); }
  const lines = [];
  let cur = "";
  for (const w of parts) {
    if (cur && ctx.measureText(cur + w).width > max) { lines.push(cur.trim()); cur = w; } else cur += w;
  }
  if (cur.trim()) lines.push(cur.trim());
  return lines;
}

function drawScene(ctx, img, caption, p, W, H) {
  const z = 1 + 0.12 * p;
  const s = Math.max(W / img.width, H / img.height) * z;
  const w = img.width * s, h = img.height * s;
  ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  ctx.font = "bold 32px 'Noto Sans Myanmar','Myanmar Text',system-ui,sans-serif";
  const lines = wrapText(ctx, caption, W - 80);
  const lh = 48, barH = lines.length * lh + 36, top = H - barH - 90;
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, top, W, barH);
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  lines.forEach((l, i) => ctx.fillText(l, W / 2, top + 18 + lh / 2 + i * lh));
}

async function makeVideo(topic) {
  const status = (m) => { $("msg2").style.color = "var(--mute)"; $("msg2").textContent = m; };
  status("ခန်းများ ရေးနေသည်...");
  const lang = $("lang").value;
  const r = await model.generateContent(
    "Create a short video storyboard about the topic below with exactly 6 scenes. Return ONLY valid JSON, no code fence, in this form: " +
    '{"scenes":[{"caption":"...","image":"..."}]}. ' +
    '"caption" is one short sentence (max 15 words) written in ' + lang + '. ' +
    '"image" is a detailed English prompt for an AI image generator for that scene, keeping a consistent visual style across scenes, with no text inside the image. Topic: ' + topic
  );
  const raw = r.response.text().replace(/```[a-z]*\n?/g, "").trim();
  const data = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));
  const scenes = (data.scenes || []).filter((x) => x && x.caption && x.image).slice(0, 8);
  if (!scenes.length) throw new Error("ခန်းများ မရပါ၊ ထပ်ကြိုးစားပါ။");

  const W = 576, H = 1024;
  const imgs = [];
  for (let i = 0; i < scenes.length; i++) {
    status("ပုံ " + (i + 1) + "/" + scenes.length + " ထုတ်နေသည်... (ခဏစောင့်ပါ)");
    imgs.push(await loadImg(scenes[i].image));
  }

  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  try { ctx.drawImage(imgs[0], 0, 0); ctx.getImageData(0, 0, 1, 1); }
  catch { throw new Error("ပုံဆာဗာက ဗီဒီယိုပေါင်းခွင့် မပေးပါ။"); }

  const types = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
  const mime = window.MediaRecorder && types.find((m) => MediaRecorder.isTypeSupported(m));
  if (!mime) throw new Error("ဒီ browser မှာ ဗီဒီယိုမှတ်တမ်းတင်ခြင်း မပါပါ။");
  const rec = new MediaRecorder(canvas.captureStream(30), { mimeType: mime, videoBitsPerSecond: 2500000 });
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  const stopped = new Promise((res) => { rec.onstop = res; });
  rec.start(500);

  const SEC = 4;
  for (let i = 0; i < imgs.length; i++) {
    status("ဗီဒီယို ပေါင်းနေသည် " + (i + 1) + "/" + imgs.length + " (tab မပိတ်ပါနဲ့၊ ဖန်သားပြင် မပိတ်ပါနဲ့)");
    const t0 = performance.now();
    await new Promise((res) => {
      const frame = () => {
        const p = Math.min((performance.now() - t0) / (SEC * 1000), 1);
        drawScene(ctx, imgs[i], scenes[i].caption, p, W, H);
        p < 1 ? requestAnimationFrame(frame) : res();
      };
      frame();
    });
  }
  rec.stop();
  await stopped;

  const url = URL.createObjectURL(new Blob(chunks, { type: mime.split(";")[0] }));
  const v = document.createElement("video");
  v.src = url; v.controls = true; v.playsInline = true; v.style.cssText = "width:100%;border-radius:10px";
  const a = document.createElement("a");
  a.href = url; a.download = "sum-ai." + (mime.includes("mp4") ? "mp4" : "webm"); a.textContent = "ဗီဒီယို သိမ်းမည်";
  a.style.cssText = "display:block;margin-top:12px;color:var(--accent)";
  $("out").replaceChildren(v, a);
  $("copyBtn").classList.add("hidden");
  $("msg2").textContent = "";
}

async function prepPhoto(file, maxSide) {
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * sc), h = Math.round(bmp.height * sc);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.9));
  const b64 = await new Promise((res) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(",")[1]);
    fr.readAsDataURL(blob);
  });
  return { blob, b64, w, h };
}

async function makeAiVideo(idea) {
  const status = (m) => { $("msg2").style.color = "var(--mute)"; $("msg2").textContent = m; };
  const file = $("imgFile").files[0];
  let photo = null;
  if (file) { status("ဓာတ်ပုံ ပြင်ဆင်နေသည်..."); photo = await prepPhoto(file, 768); }

  status("Prompt ပြင်ဆင်နေသည်...");
  const ask = photo
    ? "Look at the image. Write one English prompt (max 50 words) describing how this scene should come alive as a short video: the subject's motion, the camera and the lighting. The user's idea (may be empty): " + idea + ". Output the English prompt only, no quotes."
    : "Rewrite this idea as one vivid English prompt for a short AI video (max 50 words): describe the subject, its motion, the camera and the lighting. Output the English prompt only, no quotes: " + idea;
  const parts = [ask];
  if (photo) parts.push({ inlineData: { mimeType: "image/jpeg", data: photo.b64 } });
  const pr = await model.generateContent(parts);
  const prompt = pr.response.text().replace(/["\n]+/g, " ").trim().slice(0, 600);

  status("AI ဗီဒီယို ဆာဗာနဲ့ ချိတ်ဆက်နေသည်...");
  const { Client, handle_file } = await import("https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js");
  const client = await Client.connect("Lightricks/ltx-video-distilled");
  const dur = Number($("dur").value);

  let endpoint = "/text_to_video";
  let payload = { prompt: prompt, mode: "text-to-video", duration_ui: dur, randomize_seed: true };

  if (photo) {
    endpoint = "/image_to_video";
    const api = await client.view_api();
    const ep = api.named_endpoints && api.named_endpoints[endpoint];
    if (!ep) throw new Error("ဓာတ်ပုံမှ ဗီဒီယို endpoint မတွေ့ပါ (" + Object.keys(api.named_endpoints || {}).join(", ") + ")");
    payload = {};
    const base = 512 * 704, ar = photo.w / photo.h;
    const snap = (v) => Math.min(1280, Math.max(256, Math.round(v / 32) * 32));
    const hh = snap(Math.sqrt(base / ar)), ww = snap(Math.sqrt(base / ar) * ar);
    for (const p of ep.parameters) {
      const n = p.parameter_name;
      if (n === "prompt") payload[n] = prompt;
      else if (p.component === "Image" || /image/i.test(n)) payload[n] = handle_file(photo.blob);
      else if (n === "mode") payload[n] = "image-to-video";
      else if (n === "duration_ui") payload[n] = dur;
      else if (n === "randomize_seed") payload[n] = true;
      else if (n === "height_ui") payload[n] = hh;
      else if (n === "width_ui") payload[n] = ww;
    }
  }

  const job = client.submit(endpoint, payload);
  let out = null;
  for await (const msg of job) {
    if (msg.type === "status") {
      if (msg.stage === "error") throw new Error(msg.message || "ဗီဒီယိုဆာဗာ အမှား (အခမဲ့ quota ကုန်နေနိုင်သည်)");
      status(msg.position != null
        ? "တန်းစီနေသည် (နေရာ " + (msg.position + 1) + ")... ခဏစောင့်ပါ"
        : "ဗီဒီယို ထုတ်နေသည်... မိနစ်အနည်းငယ် ကြာနိုင်သည်");
    } else if (msg.type === "data") {
      out = msg.data;
    }
  }
  const first = out && out[0];
  const url = first && ((first.video && first.video.url) || first.url);
  if (!url) throw new Error("ဗီဒီယို မရပါ၊ ထပ်ကြိုးစားပါ။");

  const v = document.createElement("video");
  v.src = url; v.controls = true; v.playsInline = true; v.loop = true;
  v.style.cssText = "width:100%;border-radius:10px";
  const a = document.createElement("a");
  a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = "ဗီဒီယို သီးသန့်ဖွင့်မည် (ဖိထားပြီး သိမ်းပါ)";
  a.style.cssText = "display:block;margin-top:12px;color:var(--accent)";
  const note = document.createElement("div");
  note.textContent = "Prompt: " + prompt;
  note.style.cssText = "margin-top:10px;font-size:.8rem;color:var(--mute)";
  $("out").replaceChildren(v, a, note);
  $("copyBtn").classList.add("hidden");
  $("msg2").textContent = "";
}

$("genBtn").onclick = async () => {
  const t = TOOLS[current];
  const text = $("idea").value.trim();
  $("msg2").textContent = ""; $("msg2").style.color = "var(--err)";
  if (!text && !(t.kind === "aivideo" && $("imgFile").files[0])) { $("msg2").textContent = "စာသား အရင်ထည့်ပါ။"; return; }
  if ((t.kind || "").startsWith("speak")) {
    if (!("speechSynthesis" in window)) { $("msg2").textContent = "ဒီ browser မှာ အသံဖတ်ခြင်း မပါပါ။"; return; }
    speechSynthesis.cancel();
    const codes = { Burmese: "my", English: "en", Thai: "th", Chinese: "zh" };
    const pre = codes[$("lang").value];
    const voice = speechSynthesis.getVoices().find((v) => v.lang.replace("_", "-").toLowerCase().startsWith(pre));
    if (!voice) { $("msg2").textContent = "ဒီဖုန်းမှာ " + $("lang").value + " အသံ မတွေ့ပါ။ ဖုန်း Settings ထဲက Text-to-speech မှာ ထည့်ရနိုင်သည်။"; return; }
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voice; u.lang = voice.lang;
    speechSynthesis.speak(u);
    $("msg2").style.color = "var(--mute)";
    $("msg2").textContent = "ဖတ်နေသည်... (အသံ: " + voice.name + ")";
    return;
  }
  if (credits < 1) { $("msg2").textContent = "ခရက်ဒစ် မလောက်တော့ပါ။"; return; }
  const btn = $("genBtn");
  btn.disabled = true; btn.textContent = "လုပ်ဆောင်နေသည်...";
  try {
    if (t.kind === "image") {
      const pr = await model.generateContent("Rewrite this idea as one detailed English image prompt (max 60 words). Output the English prompt only, no quotes: " + text);
      const eng = pr.response.text().replace(/["\n]+/g, " ").trim().slice(0, 500);
      const src = "https://image.pollinations.ai/prompt/" + encodeURIComponent(eng) +
        "?width=768&height=768&nologo=true&seed=" + Math.floor(Math.random() * 1e6);
      const img = new Image();
      img.alt = "AI ပုံ"; img.style.cssText = "width:100%;border-radius:10px";
      await new Promise((ok, bad) => {
        img.onload = ok;
        img.onerror = () => bad(new Error("ပုံဆာဗာ ချိတ်မရပါ၊ နောက်မှ ထပ်ကြိုးစားပါ။"));
        setTimeout(() => bad(new Error("ပုံထွက်ဖို့ ကြာလွန်းနေသည်။")), 90000);
        img.src = src;
      });
      const a = document.createElement("a");
      a.href = src; a.target = "_blank"; a.rel = "noopener"; a.textContent = "ပုံကို သီးသန့်ဖွင့်မည် (ဖိထားပြီး သိမ်းပါ)";
      a.style.cssText = "display:block;margin-top:12px;color:var(--accent)";
      $("out").replaceChildren(img, a);
      $("copyBtn").classList.add("hidden");
    } else if (t.kind === "video") {
      await makeVideo(text);
    } else if (t.kind === "aivideo") {
      await makeAiVideo(text);
    } else {
      const p = t.prompt.replace("{l}", () => $("lang").value).replace("{t}", () => text) + plain($("lang").value);
      const res = await model.generateContent(p);
      $("out").textContent = res.response.text()
        .replace(/```[a-z]*\n?/g, "")
        .replace(/\*\*/g, "")
        .replace(/^#{1,6}\s*/gm, "")
        .replace(/^\s*-{3,}\s*$/gm, "")
        .replace(/^\s*\*\s+/gm, "");
      $("copyBtn").classList.remove("hidden");
    }
    $("outPanel").classList.remove("hidden");
    await updateDoc(doc(db, "users", auth.currentUser.uid), { credits: increment(-1) });
    credits -= 1; showCredits();
  } catch (e) {
    $("msg2").style.color = "var(--err)"; $("msg2").textContent = "မအောင်မြင်ပါ: " + (e.message || e);
  }
  btn.disabled = false; btn.textContent = btnLabel(t);
};

$("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText($("out").textContent); $("copyBtn").textContent = "ကူးပြီးပါပြီ ✓"; }
  catch { $("copyBtn").textContent = "ကူးမရပါ၊ စာကို ဖိထားပြီး ကူးပါ"; }
  setTimeout(() => { $("copyBtn").textContent = "ကူးယူမည်"; }, 2000);
};
window.__boot = true;
