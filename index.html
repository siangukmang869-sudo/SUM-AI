<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14122b">
<title>SUM-AI</title>
<style>
  :root {
    --bg: #14122b;
    --panel: #1e1b3d;
    --line: #34305f;
    --ink: #f3f1ff;
    --mute: #a9a5d1;
    --accent: #8f7cff;
    --accent-ink: #14122b;
    --err: #ff8a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Noto Sans Myanmar", "Myanmar Text", sans-serif;
    line-height: 1.7; min-height: 100vh;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { color: var(--mute); margin: 0 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  label { display: block; color: var(--mute); font-size: .9rem; margin: 10px 0 4px; }
  input, textarea {
    width: 100%; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }
