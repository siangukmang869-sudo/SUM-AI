<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14122b">
<title>SUM-AI</title>
<style>
  :root { --bg:#14122b; --panel:#1e1b3d; --line:#34305f; --ink:#f3f1ff; --mute:#a9a5d1; --accent:#8f7cff; --accent-ink:#14122b; --err:#ff8a8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh; line-height:1.7;
    font-family:system-ui,-apple-system,"Noto Sans Myanmar","Myanmar Text",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:1.5rem; margin:0; }
  h2 { font-size:1rem; margin:22px 0 10px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  label { display:block; color:var(--mute); font-size:.9rem; margin:10px 0 4px; }
  input, textarea, select { width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:12px; font:inherit; }
  textarea { min-height:110px; resize:vertical; }
  input:focus, textarea:focus, select:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 16px; background:var(--accent); color:var(--accent-ink); cursor:pointer; width:100%; margin-top:12px; }
  button.ghost { background:transparent; color:var(--mute); border:1px solid var(--line); }
  button.small { width:auto; margin:0; padding:8px 12px; }
  button:disabled { opacity:.55; cursor:default; }
  .row { display:flex; gap:10px; }
  .credits { font-weight:700; color:var(--accent); white-space:nowrap; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px 6px; }
  .tool { background:none; color:var(--ink); padding:0; margin:0; font-weight:500; font-size:.74rem; line-height:1.35; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .dot { width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.6rem; background:color-mix(in srgb, var(--c) 28%, var(--panel)); border:1px solid color-mix(in srgb, var(--c) 55%, transparent); }
  .tool:active .dot { transform:scale(.94); }
  #msg, #msg2 { color:var(--err); font-size:.9rem; min-height:1.4em; margin:8px 0 0; }
  #out { white-space:pre-wrap; }
  .hidden { display:none; }
</style>
</head>

  return "အမှား: " + (e && e.message ? e.message : e);
}

function loadImg(prompt) {
  return new Promise((ok, bad) => {
    const attempt = (n) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      let timer;
      const fail = () => { clearTimeout(timer); n > 1 ? attempt(n - 1) : bad(new Error("ပုံဆာဗာ ချိတ်မရပါ (အင်တာနက်၊ ဆာဗာ ရပ်နေခြင်း၊ သို့မဟုတ် ဗီဒီယိုပေါင်းခွင့် မပေးခြင်း ဖြစ်နိုင်သည်)။")); };
      timer = setTimeout(fail, 60000);
      img.onload = () => { clearTimeout(timer); ok(img); };
      img.onerror = fail;
      img.src = "https://image.pollinations.ai/prompt/" + encodeURIComponent(String(prompt).slice(0, 400) + ", vertical composition, no text") +
        "?width=576&height=1024&nologo=true&seed=" + Math.floor(Math.random() * 1e6);
    };
    attempt(2);
  });
}

function wrapText(ctx, text, max) {
  let parts;
  try {
    const seg = (g, t) => [...new Intl.Segmenter(undefined, { granularity: g }).segment(t)].map((x) => x.segment);
    parts = seg("word", text).flatMap((w) => (ctx.measureText(w).width > max ? seg("grapheme", w) : [w]));
  } catch { parts = Array.from(text); }
  const lines = [];
  let cur = "";
  for (const w of parts) {
    if (cur && ctx.measureText(cur + w).width > max) { lines.push(cur.trim()); cur = w; } else cur += w;
  }
  if (cur.trim()) lines.push(cur.trim());
  return lines;
}

function drawScene(ctx, img, caption, p, W, H) {
  const z = 1 + 0.12 * p;
  const s = Math.max(W / img.width, H / img.height) * z;
  const w = img.width * s, h = img.height * s;
  ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  ctx.font = "bold 32px 'Noto Sans Myanmar','Myanmar Text',system-ui,sans-serif";
  const lines = wrapText(ctx, caption, W - 80);
  const lh = 48, barH = lines.length * lh + 36, top = H - barH - 90;
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, top, W, barH);
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  lines.forEach((l, i) => ctx.fillText(l, W / 2, top + 18 + lh / 2 + i * lh));
}

  const status = (m) => { $("msg2").style.color = "var(--mute)"; $("msg2").textContent = m; };
  status("ခန်းများ ရေးနေသည်...");
  const lang = $("lang").value;
  const r = await model.generateContent(
    "Create a short video storyboard about the topic below with exactly 6 scenes. Return ONLY valid JSON, no code fence, in this form: " +
    '{"scenes":[{"caption":"...","image":"..."}]}. ' +
    '"caption" is one short sentence (max 15 words) written in ' + lang + '. ' +
    '"image" is a detailed English prompt for an AI image generator for that scene, keeping a consistent visual style across scenes, with no text inside the image. Topic: ' + topic
  );
  const raw = r.response.text().replace(/```[a-z]*\n?/g, "").trim();
  const data = JSON.parse(raw.slice(raw.indexOf("{"), raw.lastIndexOf("}") + 1));
  const scenes = (data.scenes || []).filter((x) => x && x.caption && x.image).slice(0, 8);
  if (!scenes.length) throw new Error("ခန်းများ မရပါ၊ ထပ်ကြိုးစားပါ။");

  const W = 576, H = 1024;
  const imgs = [];
  for (let i = 0; i < scenes.length; i++) {
    status("ပုံ " + (i + 1) + "/" + scenes.length + " ထုတ်နေသည်... (ခဏစောင့်ပါ)");
    imgs.push(await loadImg(scenes[i].image));
  }

  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  try { ctx.drawImage(imgs[0], 0, 0); ctx.getImageData(0, 0, 1, 1); }
  catch { throw new Error("ပုံဆာဗာက ဗီဒီယိုပေါင်းခွင့် မပေးပါ။"); }

  const types = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
  const mime = window.MediaRecorder && types.find((m) => MediaRecorder.isTypeSupported(m));
  if (!mime) throw new Error("ဒီ browser မှာ ဗီဒီယိုမှတ်တမ်းတင်ခြင်း မပါပါ။");
  const rec = new MediaRecorder(canvas.captureStream(30), { mimeType: mime, videoBitsPerSecond: 2500000 });
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  const stopped = new Promise((res) => { rec.onstop = res; });
  rec.start(500);

  const SEC = 4;
  for (let i = 0; i < imgs.length; i++) {
    status("ဗီဒီယို ပေါင်းနေသည် " + (i + 1) + "/" + imgs.length + " (tab မပိတ်ပါနဲ့၊ ဖန်သားပြင် မပိတ်ပါနဲ့)");
    const t0 = performance.now();
    await new Promise((res) => {
      const frame = () => {
        const p = Math.min((performance.now() - t0) / (SEC * 1000), 1);
        drawScene(ctx, imgs[i], scenes[i].caption, p, W, H);
        p < 1 ? requestAnimationFrame(frame) : res();
      };
      frame();
    });
  }
  rec.stop();
  await stopped;

  const url = URL.createObjectURL(new Blob(chunks, { type: mime.split(";")[0] }));
  const v = document.createElement("video");
  v.src = url; v.controls = true; v.playsInline = true; v.style.cssText = "width:100%;border-radius:10px";
  const a = document.createElement("a");
  a.href = url; a.download = "sum-ai." + (mime.includes("mp4") ? "mp4" : "webm"); a.textContent = "ဗီဒီယို သိမ်းမည်";
  a.style.cssText = "display:block;margin-top:12px;color:var(--accent)";
  $("out").replaceChildren(v, a);
  $("copyBtn").classList.add("hidden");
  $("msg2").textContent = "";
}
