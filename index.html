<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14122b">
<title>SUM-AI</title>
<style>
  :root { --bg:#14122b; --panel:#1e1b3d; --line:#34305f; --ink:#f3f1ff; --mute:#a9a5d1; --accent:#8f7cff; --accent-ink:#14122b; --err:#ff8a8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh; line-height:1.7;
    font-family:system-ui,-apple-system,"Noto Sans Myanmar","Myanmar Text",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:1.5rem; margin:0; }
  h2 { font-size:1rem; margin:22px 0 10px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  label { display:block; color:var(--mute); font-size:.9rem; margin:10px 0 4px; }
  input, textarea, select { width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:12px; font:inherit; }
  textarea { min-height:110px; resize:vertical; }
  input:focus, textarea:focus, select:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 16px; background:var(--accent); color:var(--accent-ink); cursor:pointer; width:100%; margin-top:12px; }
  button.ghost { background:transparent; color:var(--mute); border:1px solid var(--line); }
  button.small { width:auto; margin:0; padding:8px 12px; }
  button:disabled { opacity:.55; cursor:default; }
  .row { display:flex; gap:10px; }
  .credits { font-weight:700; color:var(--accent); white-space:nowrap; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px 6px; }
  .tool { background:none; color:var(--ink); padding:0; margin:0; font-weight:500; font-size:.74rem; line-height:1.35; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .dot { width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.6rem; background:color-mix(in srgb, var(--c) 28%, var(--panel)); border:1px solid color-mix(in srgb, var(--c) 55%, transparent); }
  .tool:active .dot { transform:scale(.94); }
  #msg, #msg2 { color:var(--err); font-size:.9rem; min-height:1.4em; margin:8px 0 0; }
  #out { white-space:pre-wrap; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>SUM-AI</h1>
    <div id="bar" class="row hidden" style="align-items:center">
      <span class="credits" id="credits">0 ခရက်ဒစ်</span>
      <button id="outBtn" class="ghost small">ထွက်မည်</button>
    </div>
  </div>

  <section id="authView" class="panel">
    <label for="email">အီးမေးလ်</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">
    <label for="pass">စကားဝှက် (အနည်းဆုံး ၆ လုံး)</label>
    <input id="pass" type="password" autocomplete="current-password">
    <div class="row">
      <button id="loginBtn">ဝင်မည်</button>
      <button id="regBtn" class="ghost">အကောင့်ဖွင့်မည်</button>
    </div>
    <p id="msg" role="alert"></p>
  </section>

  <section id="homeView" class="hidden"></section>

  <section id="toolView" class="hidden">
    <button id="backBtn" class="ghost small" style="margin-bottom:12px">‹ နောက်သို့</button>
    <div class="panel">
      <h2 id="toolTitle" style="margin-top:0"></h2>
      <label for="idea" id="ideaLabel"></label>
      <textarea id="idea" placeholder="ဒီမှာ ရေးထည့်ပါ"></textarea>
      <div id="langBox" class="hidden">
        <label for="lang">ပြန်မည့် ဘာသာစကား</label>
        <select id="lang"><option value="Burmese">Burmese (မြန်မာ)</option><option value="English">English</option><option value="Thai">Thai</option><option value="Chinese">Chinese</option></select>
      </div>
      <button id="genBtn">စတင်မည် (၁ ခရက်ဒစ်)</button>
      <p id="msg2" role="alert"></p>
    </div>
    <div class="panel hidden" id="outPanel">
      <div id="out"></div>
      <button id="copyBtn" class="ghost">ကူးယူမည်</button>
    </div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app-check.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import { getAI, getGenerativeModel, GoogleAIBackend } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-ai.js";

const firebaseConfig = {
  apiKey: "AIzaSyCRzCPLQ-ObY6EXoKxgyKucBKmzqx1LzVg",
  authDomain: "sum-ai-17ff2.firebaseapp.com",
  projectId: "sum-ai-17ff2",
  storageBucket: "sum-ai-17ff2.firebasestorage.app",
  messagingSenderId: "134994518975",
  appId: "1:134994518975:web:552f16c5c31b4032f4f70a"
};

const app = initializeApp(firebaseConfig);
initializeAppCheck(app, {
  provider: new ReCaptchaEnterpriseProvider("6LfefPMtAAAAAFe_w9zliIeEaQhyLaLfwQr50DKA"),
  isTokenAutoRefreshEnabled: true
});
const auth = getAuth(app);
const db = getFirestore(app);
const model = getGenerativeModel(getAI(app, { backend: new GoogleAIBackend() }), { model: "gemini-3.8-flash" });

const $ = (id) => document.getElementById(id);
const START_CREDITS = 10;
let credits = 0;

// [id, icon, label, input label, English prompt ({t}=text, {l}=language), lang?]
const plain = (lang) => " Write the answer in " + lang + " (if the task already fixes the output language, follow the task). Plain text only: never use Markdown symbols such as **, ##, ---, or asterisk bullets.";
const CATS = [
  { n: "AI ပုံ", c: "#ff5d5d", t: [
    ["image","🎨","AI ပုံထုတ်","ထုတ်ချင်သော ပုံအကြောင်း (ပုံစံပါ ရေးနိုင်သည်)","", false, "image"]
  ]},
  { n: "အသံ", c: "#34d399", t: [
    ["tts","🔊","အသံဖတ်","ဖတ်စေချင်သော စာသား","", true, "speak"]
  ]},
  { n: "ဗီဒီယိုအတွက်", c: "#8f7cff", t: [
    ["recap","🎬","Recap စာသား","ရုပ်ရှင်/ဗီဒီယို အကျဉ်း","Write a narration script for a recap video from this summary. Start with a hook and use short paragraphs: {t}"],
    ["vscript","🎥","ဗီဒီယို Script","ဗီဒီယို အကြောင်းအရာ","Write a short-form video script (hook, main points, call to action) about: {t}"],
    ["ytitle","🔥","YouTube ခေါင်းစဉ်","ဗီဒီယို အကြောင်းအရာ","Give 10 catchy YouTube titles for a video about: {t}"],
    ["caption","📝","Caption ရေး","ပို့စ် အကြောင်းအရာ","Write 3 engaging social media captions for: {t}"],
    ["hashtag","#️⃣","Hashtag","ပို့စ် အကြောင်းအရာ","Suggest 15 relevant hashtags for: {t}"],
    ["vprompt","🎞️","AI ဗီဒီယို Prompt","ဗီဒီယို အကြံ","Write a detailed prompt in English for an AI video generator based on this idea. Output the English prompt only: {t}", false],
    ["thumb","🖌️","Thumbnail အကြံ","ဗီဒီယို အကြောင်းအရာ","Suggest 5 thumbnail ideas, each with a short bold text overlay, for a video about: {t}"]
  ]},
  { n: "ဖန်တီးရေး", c: "#ff7ab6", t: [
    ["story","📖","ဇာတ်လမ်း","ခေါင်းစဉ် သို့မဟုတ် အကြံ","Write a short story with a beginning, middle and end about: {t}"],
    ["poem","🪶","ကဗျာ","ကဗျာ အကြောင်းအရာ","Write a poem about: {t}"],
    ["joke","😄","ဟာသ","ဟာသ အကြောင်းအရာ","Write a funny short joke or humorous tale about: {t}"],
    ["names","🏷️","နာမည်ပေး","ဘာအတွက် နာမည်လဲ","Suggest 15 creative names (brand, page or channel) for: {t}"],
    ["iprompt","🖼️","AI ပုံ Prompt","ပုံ အကြံ","Write a detailed prompt in English for an AI image generator based on this idea. Output the English prompt only: {t}", false]
  ]},
  { n: "ကြော်ငြာ", c: "#ffb347", t: [
    ["ad","📣","ကြော်ငြာစာ","ရောင်းမည့် ပစ္စည်း/ဝန်ဆောင်မှု","Write a persuasive Facebook ad post with an attention-grabbing opening and a call to action for: {t}"],
    ["product","🛍️","ထုတ်ကုန် ဖော်ပြချက်","ထုတ်ကုန် အချက်အလက်","Write a product description highlighting key benefits for: {t}"],
    ["invite","✉️","ဖိတ်စာ/နှုတ်ဆက်","ဘာအခါအတွက်လဲ","Write a warm, polite message or invitation for this occasion: {t}"]
  ]},
  { n: "ဘာသာစကား", c: "#4ec9b0", t: [
    ["translate","🌐","ဘာသာပြန်","ပြန်ချင်သော စာသား","Translate the following text into {l}. Return only the translation: {t}", true],
    ["srt","💬","SRT ဘာသာပြန်","SRT စာသား (paste လုပ်ပါ)","Translate this SRT subtitle into {l}. Keep every number and timestamp line exactly unchanged and translate only the text lines. Return valid SRT only, no explanation: {t}", true],
    ["fix","✅","စာပြင်","ပြင်ချင်သော စာသား","Correct the spelling and grammar of this text without changing its meaning. Return only the corrected text in the same language: {t}", false],
    ["sum","📑","အတိုချုပ်","အတိုချုပ်လိုသော စာသား","Summarize this text in a few short sentences: {t}"],
    ["simple","🧩","ရိုးရှင်းအောင်ပြော","ရိုးရှင်းစေချင်သော စာသား","Rewrite this text in simple, easy-to-understand language: {t}"]
  ]},
  { n: "သင်ယူ & လုပ်ငန်း", c: "#5aa9ff", t: [
    ["explain","🎓","ရှင်းပြပေး","သိချင်သော အကြောင်းအရာ","Explain this topic simply with an everyday example: {t}"],
    ["quiz","❓","Quiz ထုတ်","ဘာအကြောင်း quiz လဲ","Create 5 multiple-choice quiz questions with answers about: {t}"],
    ["cover","💼","Cover Letter","အလုပ်နှင့် ကိုယ်ရေးအချက်","Write a professional cover letter for this job and background: {t}"],
    ["recipe","🍳","ဟင်းချက်နည်း","ဟင်း/အစားအစာ နာမည်","Give a recipe with ingredients and steps for: {t}"],
    ["trip","✈️","ခရီးစဉ်","ဘယ်သွားမလဲ၊ ဘယ်နှရက်လဲ","Plan a simple travel itinerary for: {t}"]
  ]}
];
const TOOLS = {};
CATS.forEach((c) => c.t.forEach((x) => { TOOLS[x[0]] = { icon: x[1], name: x[2], label: x[3], prompt: x[4], lang: x[5] !== false, kind: x[6] }; }));

// home grid
$("homeView").innerHTML = CATS.map((c) =>
  `<h2>${c.n}</h2><div class="grid">` +
  c.t.map((x) => `<button class="tool" data-id="${x[0]}" style="--c:${c.c}"><span class="dot">${x[1]}</span>${x[2]}</button>`).join("") +
  `</div>`).join("");
$("homeView").onclick = (e) => {
  const b = e.target.closest(".tool");
  if (b) openTool(b.dataset.id);
};

let current = null;
const btnLabel = (t) => (t.kind || "").startsWith("speak") ? "ဖတ်မည် (အခမဲ့)" : "စတင်မည် (၁ ခရက်ဒစ်)";
if ("speechSynthesis" in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
function openTool(id) {
  current = id;
  const t = TOOLS[id];
  $("toolTitle").textContent = t.icon + " " + t.name;
  $("ideaLabel").textContent = t.label;
  $("idea").value = "";
  $("langBox").classList.toggle("hidden", !t.lang);
  $("genBtn").textContent = btnLabel(t);
  $("langBox").querySelector("label").textContent = (t.kind || "").startsWith("speak") ? "ဖတ်မည့် ဘာသာစကား" : "ရလဒ် ဘာသာစကား";
  $("outPanel").classList.add("hidden");
  $("msg2").textContent = "";
  $("homeView").classList.add("hidden");
  $("toolView").classList.remove("hidden");
  window.scrollTo(0, 0);
}
$("backBtn").onclick = () => {
  $("toolView").classList.add("hidden");
  $("homeView").classList.remove("hidden");
};

function errText(e) {
  const c = (e && e.code) || "";
  if (c.includes("invalid-email")) return "အီးမေးလ် ပုံစံ မှားနေသည်။";
  if (c.includes("weak-password")) return "စကားဝှက် အနည်းဆုံး ၆ လုံး လိုသည်။";
  if (c.includes("email-already-in-use")) return "ဤအီးမေးလ်ဖြင့် အကောင့်ရှိပြီးသား၊ ဝင်မည်ကို နှိပ်ပါ။";
  if (c.includes("invalid-credential") || c.includes("wrong-password") || c.includes("user-not-found")) return "အီးမေးလ် သို့မဟုတ် စကားဝှက် မှားနေသည်။";
  if (c.includes("network")) return "အင်တာနက် ချိတ်ဆက်မှု စစ်ပါ။";
  return "အမှား: " + (e && e.message ? e.message : e);
}
$("loginBtn").onclick = async () => { $("msg").textContent = ""; try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); } catch (e) { $("msg").textContent = errText(e); } };
$("regBtn").onclick = async () => { $("msg").textContent = ""; try { await createUserWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); } catch (e) { $("msg").textContent = errText(e); } };
$("outBtn").onclick = () => signOut(auth);

function showCredits() { $("credits").textContent = credits + " ခရက်ဒစ်"; }

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    $("authView").classList.remove("hidden");
    $("bar").classList.add("hidden");
    $("homeView").classList.add("hidden");
    $("toolView").classList.add("hidden");
    return;
  }
  $("authView").classList.add("hidden");
  $("bar").classList.remove("hidden");
  $("homeView").classList.remove("hidden");
  try {
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, { email: user.email, credits: START_CREDITS });
      credits = START_CREDITS;
    } else {
      credits = snap.data().credits ?? 0;
    }
    showCredits();
  } catch (e) {
    $("credits").textContent = "ခရက်ဒစ် ဖတ်မရပါ";
  }
});

$("genBtn").onclick = async () => {
  const t = TOOLS[current];
  const text = $("idea").value.trim();
  $("msg2").textContent = ""; $("msg2").style.color = "var(--err)";
  if (!text) { $("msg2").textContent = "စာသား အရင်ထည့်ပါ။"; return; }
  if ((t.kind || "").startsWith("speak")) {
    if (!("speechSynthesis" in window)) { $("msg2").textContent = "ဒီ browser မှာ အသံဖတ်ခြင်း မပါပါ။"; return; }
    speechSynthesis.cancel();
    const codes = { Burmese: "my", English: "en", Thai: "th", Chinese: "zh" };
    const pre = codes[$("lang").value];
    const voice = speechSynthesis.getVoices().find((v) => v.lang.replace("_", "-").toLowerCase().startsWith(pre));
    if (!voice) { $("msg2").textContent = "ဒီဖုန်းမှာ " + $("lang").value + " အသံ မတွေ့ပါ။ ဖုန်း Settings ထဲက Text-to-speech မှာ ထည့်ရနိုင်သည်။"; return; }
    const u = new SpeechSynthesisUtterance(text);
    u.voice = voice; u.lang = voice.lang;
    speechSynthesis.speak(u);
    $("msg2").style.color = "var(--mute)";
    $("msg2").textContent = "ဖတ်နေသည်... (အသံ: " + voice.name + ")";
    return;
  }
  if (credits < 1) { $("msg2").textContent = "ခရက်ဒစ် မလောက်တော့ပါ။"; return; }
  const btn = $("genBtn");
  btn.disabled = true; btn.textContent = "လုပ်ဆောင်နေသည်...";
  try {
    if (t.kind === "image") {
      const pr = await model.generateContent("Rewrite this idea as one detailed English image prompt (max 60 words). Output the English prompt only, no quotes: " + text);
      const eng = pr.response.text().replace(/["\n]+/g, " ").trim().slice(0, 500);
      const src = "https://image.pollinations.ai/prompt/" + encodeURIComponent(eng) +
        "?width=768&height=768&nologo=true&seed=" + Math.floor(Math.random() * 1e6);
      const img = new Image();
      img.alt = "AI ပုံ"; img.style.cssText = "width:100%;border-radius:10px";
      await new Promise((ok, bad) => {
        img.onload = ok;
        img.onerror = () => bad(new Error("ပုံဆာဗာ ချိတ်မရပါ၊ နောက်မှ ထပ်ကြိုးစားပါ။"));
        setTimeout(() => bad(new Error("ပုံထွက်ဖို့ ကြာလွန်းနေသည်။")), 90000);
        img.src = src;
      });
      const a = document.createElement("a");
      a.href = src; a.target = "_blank"; a.rel = "noopener"; a.textContent = "ပုံကို သီးသန့်ဖွင့်မည် (ဖိထားပြီး သိမ်းပါ)";
      a.style.cssText = "display:block;margin-top:12px;color:var(--accent)";
      $("out").replaceChildren(img, a);
      $("copyBtn").classList.add("hidden");
    } else {
      const p = t.prompt.replace("{l}", () => $("lang").value).replace("{t}", () => text) + plain($("lang").value);
      const res = await model.generateContent(p);
      $("out").textContent = res.response.text()
        .replace(/```[a-z]*\n?/g, "")
        .replace(/\*\*/g, "")
        .replace(/^#{1,6}\s*/gm, "")
        .replace(/^\s*-{3,}\s*$/gm, "")
        .replace(/^\s*\*\s+/gm, "");
      $("copyBtn").classList.remove("hidden");
    }
    $("outPanel").classList.remove("hidden");
    await updateDoc(doc(db, "users", auth.currentUser.uid), { credits: increment(-1) });
    credits -= 1; showCredits();
  } catch (e) {
    $("msg2").textContent = "မအောင်မြင်ပါ: " + (e.message || e);
  }
  btn.disabled = false; btn.textContent = btnLabel(t);
};

$("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText($("out").textContent); $("copyBtn").textContent = "ကူးပြီးပါပြီ ✓"; }
  catch { $("copyBtn").textContent = "ကူးမရပါ၊ စာကို ဖိထားပြီး ကူးပါ"; }
  setTimeout(() => { $("copyBtn").textContent = "ကူးယူမည်"; }, 2000);
};
</script>
</body>
</html>
